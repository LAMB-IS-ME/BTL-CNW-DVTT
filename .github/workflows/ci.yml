name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: exam_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: exam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exam_test -d exam_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://exam_test:ci-test-only@localhost:5432/exam_test
      TEST_DATABASE_URL: postgresql://exam_test:ci-test-only@localhost:5432/exam_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:deployment
      - run: npm audit --audit-level=low
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: test-results/
          retention-days: 7
